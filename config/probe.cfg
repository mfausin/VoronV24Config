#####################################################################
# 	Probe
#####################################################################
[dockable_probe]
pin: EBBCan:PB6
x_offset: 0
y_offset: 20
z_offset: 6.0
speed: 5
lift_speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.01
samples_tolerance_retries: 3
approach_position: 85, 270
dock_position: 85, 306
detach_position: 135, 306
z_hop: 15.0
check_open_attach: True
attach_speed: 50.0
detach_speed: 50.0
travel_speed: 300.0
restore_toolhead: False

