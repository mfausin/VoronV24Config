#####################################################################
# 	Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

endstop_pin: ^PA0
homing_speed: 15
second_homing_speed: 3.0
homing_retract_dist: 5.0
position_max: 275
position_min: -5
position_endstop = 2.500

[tmc2209 stepper_z]
uart_pin: PD10

interpolate: True
run_current: 1.0
sense_resistor: 0.110

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1

##	In E1-MOT Position
##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PE6
dir_pin: !PC13
