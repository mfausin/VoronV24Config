#####################################################################
# 	Extruder
#####################################################################
[fan]
pin: EBBCan:PA1
max_power: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0
shutdown_speed: 0.0

[heater_fan hotend_fan]
pin: EBBCan:PA0
max_power: 1.0
fan_speed: 1.0
kick_start_time: 0.5
shutdown_speed: 1.0
heater: extruder
heater_temp: 50.0

#[heater_fan 4W_FAN0]
#pin: EBBCan: PB14
#tachometer_pin: EBBCan: PB15
#tachometer_ppr: 1

#####################################################################
# 	Controller
#####################################################################
[controller_fan controller_fan]
#	Controller fan - FAN2 Connector PB2
pin: PB2
max_power: 1.0
fan_speed: 0.8
shutdown_speed: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.5
idle_timeout: 120
heater:
stepper: stepper_z, stepper_z1, stepper_z2, stepper_z3, stepper_x, stepper_y

#####################################################################
# 	Air Filtration
#####################################################################
[heater_fan exhaust_fan]
#[fan_generic exhaust_fan]
#  Exhaust fan - FAN5 Connector PB7
pin: !PB7
max_power: 1
fan_speed: 0.4
cycle_time: 0.001
hardware_pwm: False
kick_start_time: 0
heater: heater_bed
heater_temp: 60

[heater_fan nevermore]
#[fan_generic nevermore]
#  Nevermore Filter - HEAT1 Connector PC8
pin: PC8
max_power: 1.0
#fan_speed: 0.7
shutdown_speed: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.5
heater: heater_bed
heater_temp: 60