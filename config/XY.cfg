#use_sensorless_homing: true
homing_positive_dir: true
homing_speed: 110
min_home_dist: 40
homing_retract_dist: 40
position_min: 0
position_max: 310
position_endstop: 310

[tmc2209 stepper_y]
uart_pin: PE15
diag_pin: ^PB13

interpolate: True
run_current: 1.0
home_current: 0.7
sense_resistor: 0.110

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
