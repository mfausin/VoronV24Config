## Voron Design VORON2 250/300/350mm

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_210002000D51323532343932-if00
canbus_uuid: 351e992fd2a9

#[mcu nhk]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_3232323236193F51-if00
#restart_method: command

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 66a21c4f842d


[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 15000     	   	  #Max 4000
max_z_velocity: 20 			    #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 200   			    #Max ?
square_corner_velocity: 5.0  #Can experiment with 8.0, default 5.0
#max_accel: 10000             #Max Acceloration for Measuring the resonances

[idle_timeout]
timeout: 3600

[gcode_arcs]
resolution: 0.1

[exclude_object]

[force_move]
enable_force_move: True

#####################################################################
# Stepper & TMC Settings
#####################################################################

#####################################################################
# 	X Stepper Settings
#####################################################################

[stepper_x]
##	Connected to X-MOT (B Motor)
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
##	For 300mm build
position_endstop: 301
position_max: 301
##------------------
homing_speed: 110   #Max 100
homing_retract_dist: 0
min_home_dist: 40
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
diag_pin: ^PB14
interpolate: True
run_current: 1.0
home_current: 0.7
sense_resistor: 0.110
#current_change_dwell_time: 0.2
#stealthchop_threshold: 0
#driver_SGTHRS: 140

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
sg4_thrs: 155
extra_hysteresis: 1
tbl: 3

#####################################################################
# 	Y Stepper Settings
#####################################################################

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
##	For 300mm build
position_endstop: 310
position_max: 310
##-------------------
homing_speed: 110  #Max 100
homing_retract_dist: 0
min_home_dist: 40
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
diag_pin: ^PB13
interpolate: True
run_current: 1.0
home_current: 0.7
sense_resistor: 0.110
#current_change_dwell_time: 0.2
#stealthchop_threshold: 0
#driver_SGTHRS: 160

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
sg4_thrs: 157
extra_hysteresis: 1
tbl: 3

 
#####################################################################
# 	Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200
#endstop_pin: probe:z_virtual_endstop
endstop_pin: ^PA0
homing_speed: 8
second_homing_speed: 3.0
homing_retract_dist: 5.0
position_max: 275
position_min: -5

[tmc2209 stepper_z]
uart_pin: PD10
interpolate: True
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1

##	In E1-MOT Position
##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PE6
dir_pin: !PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0

[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1

##	In E2-MOT Position
##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PE2
dir_pin: PE4
enable_pin: !PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: True
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0

[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1

##	In E3-MOT Position
##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z3]
uart_pin: PA15
interpolate: True
run_current: 1.0
sense_resistor: 0.110
#stealthchop_threshold: 0

[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1

#####################################################################
# 	Bed Heater Settings
#####################################################################

[heater_bed]
##	SSR Pin - In BED OUT position
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: 0
max_temp: 135

## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"

#####################################################################
# 	Fan Settings
#####################################################################

[controller_fan controller_fan]
#	Controller fan - FAN2 Connector PB2
pin: PB2
max_power: 1.0
fan_speed: 0.8
shutdown_speed: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.5
idle_timeout: 120
heater:
stepper: stepper_z, stepper_z1, stepper_z2, stepper_z3, stepper_x, stepper_y

[heater_fan exhaust_fan]
#[fan_generic exhaust_fan]
#  Exhaust fan - FAN5 Connector PB7
pin: !PB7
max_power: 1
fan_speed: 0.4
cycle_time: 0.001
hardware_pwm: False
kick_start_time: 0
heater: heater_bed
heater_temp: 60

[heater_fan nevermore]
#[fan_generic nevermore]
#  Nevermore Filter - HEAT1 Connector PC8
pin: PC8
max_power: 1.0
#fan_speed: 0.7
shutdown_speed: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.5
heater: heater_bed
heater_temp: 60

#####################################################################
# 	Temperature Sensors
#####################################################################

[temperature_sensor rPi_CPU]
sensor_type: temperature_host
min_temp: 0
max_temp: 150
gcode_id: PI

[temperature_sensor main_mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 150

## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"

#####################################################################
# 	Shaketune
#####################################################################

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

