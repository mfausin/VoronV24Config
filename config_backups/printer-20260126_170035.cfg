## Voron Design VORON2 250/300/350mm

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_210002000D51323532343932-if00
canbus_uuid: 351e992fd2a9

#[mcu nhk]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_3232323236193F51-if00
#restart_method: command

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 66a21c4f842d


[printer]
kinematics: corexy
max_velocity: 500  
max_accel: 4000     	   	  #Max 4000
max_z_velocity: 50 			    #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 700   			    #Max ?
square_corner_velocity: 5.0  #Can experiment with 8.0, default 5.0
#max_accel: 10000             #Max Acceloration for Measuring the resonances

[idle_timeout]
timeout: 3600

[gcode_arcs]
resolution: 0.1

[exclude_object]

[force_move]
enable_force_move: True

#####################################################################
# Stepper & TMC Settings
#####################################################################

#####################################################################
# 	X Stepper Settings
#####################################################################

[stepper_x]
##	Connected to X-MOT (B Motor)
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
##	For 300mm build
position_endstop: 300
position_max: 300
##------------------
homing_speed: 50   #Max 100
homing_retract_dist: 0
min_home_dist: 40
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
interpolate: True
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PB14
driver_SGTHRS: 120
home_current: 0.49
current_change_dwell_time: 0.2

#####################################################################
# 	Y Stepper Settings
#####################################################################

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
##	For 300mm build
position_endstop: 307
position_max: 307
##-------------------
homing_speed: 50  #Max 100
homing_retract_dist: 0
min_home_dist: 40
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
interpolate: True
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^PB13
driver_SGTHRS: 140
home_current: 0.49
current_change_dwell_time: 0.2
 
#####################################################################
# 	Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD14
dir_pin: PD13
enable_pin: !PD15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200
#endstop_pin: probe:z_virtual_endstop
endstop_pin: ^PA0
homing_speed: 8
second_homing_speed: 3.0
homing_retract_dist: 5.0
position_max: 275
position_min: -5

[tmc2209 stepper_z]
uart_pin: PD10
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 35

##	In E1-MOT Position
##	Z1 Stepper - Rear Left
[stepper_z1]
step_pin: PE6
dir_pin: !PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 35

##	In E2-MOT Position
##	Z2 Stepper - Rear Right
[stepper_z2]
step_pin: PE2
dir_pin: PE4
enable_pin: !PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 35

##	In E3-MOT Position
##	Z3 Stepper - Front Right
[stepper_z3]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
full_steps_per_rotation: 200

[tmc2209 stepper_z3]
uart_pin: PA15
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 35

#####################################################################
# 	Bed Heater Settings
#####################################################################

[heater_bed]
##	SSR Pin - In BED OUT position
heater_pin: PB4
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: 0
max_temp: 135

## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"

#####################################################################
# 	Fan Settings
#####################################################################

[controller_fan controller_fan]
#	Controller fan - FAN2 Connector PB2
pin: PB2
max_power: 1.0
fan_speed: 1.0
shutdown_speed: 1.0
cycle_time: 0.08
hardware_pwm: False
kick_start_time: 0
idle_timeout: 120
heater:
stepper: stepper_z, stepper_z1, stepper_z2, stepper_z3, stepper_x, stepper_y

[heater_fan exhaust_fan]
#[fan_generic exhaust_fan]
#  Exhaust fan - FAN5 Connector PB7
pin: !PB7
max_power: 1
fan_speed: 0.4
cycle_time: 0.001
hardware_pwm: False
kick_start_time: 0
heater: heater_bed
heater_temp: 60

[heater_fan nevermore]
#[fan_generic nevermore]
#  Nevermore Filter - HEAT1 Connector PC8
pin: PC8
max_power: 1.0
#fan_speed: 0.7
shutdown_speed: 1.0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0
heater: heater_bed
heater_temp: 60

#####################################################################
# 	Temperature Sensors
#####################################################################

[temperature_sensor rPi_CPU]
sensor_type: temperature_host
min_temp: 0
max_temp: 150
gcode_id: PI

[temperature_sensor main_mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 150

## 	Thermistor Types
##   "EPCOS 100K B57560G104F"
##   "ATC Semitec 104GT-2"
##   "NTC 100K beta 3950"
##   "Honeywell 100K 135-104LAG-J01"
##   "NTC 100K MGB18-104F39050L32" (Keenovo Heater Pad)
##   "AD595"
##   "PT100 INA826"

#####################################################################
# Include Configs
#####################################################################
[include mainsail.cfg]
#[include C_nitehawk-sb.cfg]
[include C_EBBCan.cfg]
[include C_z-auto-bed-mesh-qgl.cfg]
[include Variables.cfg]

#####################################################################
#  Macros
#####################################################################
[include M_adv_filament_swap.cfg]
[include M_homing-qgl-bed-mesh.cfg]
#[include M_klicky-macros.cfg]
[include M_park-positions.cfg]
[include M_print-start-end.cfg]
[include M_printtime.cfg]
[include M_stealthburner_leds.cfg]

