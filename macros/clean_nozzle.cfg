[gcode_macro NOZZLE_WIPE]
description: Wipe the nozzle over the brush
gcode:
   {% set start_x = printer["gcode_macro _CLIENT_VARIABLE"].start_x|int %}
   {% set start_y = printer["gcode_macro _CLIENT_VARIABLE"].start_y|int %}
   {% set start_z = printer["gcode_macro _CLIENT_VARIABLE"].start_z|int %}
   {% set spd_xy = printer["gcode_macro _CLIENT_VARIABLE"].speed_move|int %}
   {% set spd_z = printer["gcode_macro _CLIENT_VARIABLE"].speed_hop|int %}
   {% set wipe_dist = printer["gcode_macro _CLIENT_VARIABLE"].wipe_dist|int %}
   {% set wipe_qty = printer["gcode_macro _CLIENT_VARIABLE"].wipe_qty|int %}
   {% set wipe_spd = printer["gcode_macro _CLIENT_VARIABLE"].wipe_spd|int %}
   {% set raise_distance = printer["gcode_macro _CLIENT_VARIABLE"].raise_distance|int %}
  
   SAVE_GCODE_STATE NAME=STATE_NOZZLE_WIPE
   
   _CG28
   G90
   
   ## Move nozzle to start position
   RESPOND MSG="Move nozzle to the brush"
   G1 X{start_x} Y{start_y} F{spd_xy * 60}
   G1 Z{start_z} F{spd_z * 60}
   
   ## Wipe nozzle
   RESPOND MSG="Wipe nozzle"
   {% for wipes in range(1, (wipe_qty + 1)) %}
     G1 X{start_x + wipe_dist} F{wipe_spd * 60}
     G1 X{start_x} F{wipe_spd * 60}
   {% endfor %}
   
   ## Raise nozzle
   G1 Z{raise_distance}
   
   RESTORE_GCODE_STATE NAME=STATE_NOZZLE_WIPE
    
[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle and wipe
gcode:
   {% set pb_x = printer["gcode_macro _CLIENT_VARIABLE"].purge_x|int %}
   {% set pb_y = printer["gcode_macro _CLIENT_VARIABLE"].purge_y|int %}
   {% set pb_z = printer["gcode_macro _CLIENT_VARIABLE"].purge_z|int %}
   {% set spd_xy = printer["gcode_macro _CLIENT_VARIABLE"].speed_move|int %}
   {% set spd_z = printer["gcode_macro _CLIENT_VARIABLE"].speed_hop|int %}
   {% set purge_dist = printer["gcode_macro _CLIENT_VARIABLE"].purge_dist|int %}
   {% set purge_spd = printer["gcode_macro _CLIENT_VARIABLE"].load_spd|int %}
   {% set retract = printer["gcode_macro _CLIENT_VARIABLE"].retract|int %}
   {% set retract_spd = printer["gcode_macro _CLIENT_VARIABLE"].speed_retract|int %}
   {% set EXTRUDER = params.T|default(0)|float %} 
 
   SAVE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN
   RESPOND MSG="Cleaning Nozzle..."
   
   _CG28
   G90
   
   ## Move nozzle to start position
   RESPOND MSG="Move nozzle to the purge bucket"
   G1 X{pb_x} Y{pb_y} F{spd_xy * 60}
   G1 Z{pb_z} F{spd_z * 60}
   
   G92 E0.0
   LOW_TEMP_CHECK T={EXTRUDER}
   
   G1 E{purge_dist} F{purge_spd * 60}
   G4 S5
   G1 E-{retract} F{retract_spd * 60}
   G92 E0.0
   G4 S3
   
   NOZZLE_WIPE
   
   RESTORE_GCODE_STATE NAME=STATE_NOZZLE_CLEAN